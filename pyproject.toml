[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macti"
version = "1.5.0"
description = "Biblioteca para evaluación de Jupyter Notebooks, Visualización de datos orientada a la enseñanza en nivel licenciatura."
authors = [{ name = "Luis Miguel de la Cruz Salas", email = "luiggi@igeofisica.unam.mx" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "nbgrader>=0.9.5",
    "numpy>=2.1.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
    "widgetsnbextension>=4.0.13",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["macti", "macti.eval", "macti.math", "macti.vis", "macti.resources"]
include-package-data = true
#license-files = ["MIT"]

[tool.setuptools.package-data]
"macti" = ["./resources/*"]
